<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aspyra Realty CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>const _w=console.warn;console.warn=function(m){if(String(m).indexOf('cdn.tailwindcss.com')<0)_w.apply(console,arguments)}</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{color-scheme:dark}
body{font-family:Manrope,sans-serif;background:#0b1015;color:#e6e9ee;background-image:radial-gradient(900px 400px at 85% -10%,rgba(201,162,75,.12),transparent),radial-gradient(700px 400px at -10% 30%,rgba(45,212,191,.07),transparent);background-attachment:fixed}
.serif{font-family:Fraunces,serif}
.glass{background:rgba(255,255,255,.04);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:14px}
.in{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:.5rem .75rem;font-size:.875rem;outline:none}
.in:focus{border-color:#c9a24b;box-shadow:0 0 0 2px rgba(201,162,75,.25)}
.in option{background:#141a21}
.btn{background:#c9a24b;color:#1a1405;font-weight:700;border-radius:10px;padding:.5rem 1rem;font-size:.875rem}
.btn:hover{background:#d8b45f}
.ghost{border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:.5rem .9rem;font-size:.875rem}
.ghost:hover{background:rgba(255,255,255,.07)}
.lbl{font-size:.75rem;color:#8b95a3;margin-bottom:.25rem;display:block}
.chip{font-size:.7rem;font-weight:600;padding:.15rem .55rem;border-radius:999px;white-space:nowrap;display:inline-block}
.col.over{outline:2px dashed #c9a24b}
.dz{border:2px dashed rgba(255,255,255,.18);border-radius:12px;cursor:pointer}.dz.over,.dz:hover{border-color:#c9a24b;background:rgba(201,162,75,.08)}
.drawer{transform:translateX(100%);transition:transform .25s}.drawer.on{transform:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a3340;border-radius:8px}
button:focus-visible,a:focus-visible{outline:2px solid #c9a24b;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="min-h-screen">

<!-- LOGIN -->
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <form id="lf" class="glass w-full max-w-sm p-8 space-y-4" autocomplete="off">
    <div class="text-center mb-2">
      <div class="w-12 h-12 mx-auto rounded-xl bg-[#c9a24b] text-[#1a1405] flex items-center justify-center text-xl mb-3"><i class="fa-solid fa-building"></i></div>
      <h1 class="serif text-3xl">Aspyra Realty</h1>
      <p class="text-sm text-slate-400 mt-1">Sign in to your lead workspace</p>
    </div>
    <div><label class="lbl" for="u">Username</label><input id="u" class="in" required></div>
    <div><label class="lbl" for="p">Password</label><input id="p" type="password" class="in" required></div>
    <p id="le" class="text-sm text-rose-400 hidden">Username or password is incorrect. Check both and try again.</p>
    <button class="btn w-full py-2.5">Sign in</button>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="sticky top-0 z-30 bg-[#0b1015]/80 backdrop-blur border-b border-white/10">
    <div class="max-w-[1500px] mx-auto px-4 py-3 flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-[#c9a24b] text-[#1a1405] flex items-center justify-center"><i class="fa-solid fa-building"></i></div>
      <div class="serif text-xl leading-none">Aspyra Realty<div class="font-[Manrope] text-[11px] text-slate-400 font-medium mt-1" id="who"></div></div>
      <div class="flex-1"></div>
      <span id="mode" class="hidden text-xs text-amber-300 bg-amber-400/10 border border-amber-400/20 rounded-full px-3 py-1" title="Add your Firebase config to sync live">Local mode</span>
      <div class="relative">
        <button onclick="toggleBell()" class="ghost relative" aria-label="Notifications"><i class="fa-solid fa-bell"></i><span id="bb" class="absolute -top-2 -right-2 min-w-[20px] h-5 px-1 rounded-full bg-rose-500 text-[11px] font-bold flex items-center justify-center hidden">0</span></button>
        <div id="bp" class="hidden absolute right-0 mt-2 w-80 max-w-[90vw] glass bg-[#141a21] p-2 max-h-96 overflow-auto shadow-2xl"></div>
      </div>
      <button onclick="logout()" class="ghost"><i class="fa-solid fa-right-from-bracket"></i><span class="hidden sm:inline ml-2">Sign out</span></button>
    </div>
  </header>

  <main class="max-w-[1500px] mx-auto px-4 py-6 space-y-5">
    <section id="kpis" class="grid grid-cols-2 lg:grid-cols-4 gap-3"></section>

    <section class="glass p-4 space-y-3">
      <div class="grid grid-cols-1 md:grid-cols-6 gap-3">
        <div class="md:col-span-2 relative"><i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-sm"></i><input id="fq" class="in pl-9" placeholder="Search name, phone, location, property type" oninput="S.f.q=this.value;render()"></div>
        <select id="fs" class="in" onchange="S.f.status=this.value;render()"></select>
        <select id="fa" class="in" onchange="S.f.agent=this.value;render()"></select>
        <select id="ff" class="in" onchange="S.f.fu=this.value;render()">
          <option value="">Any follow-up</option><option value="overdue">Overdue</option><option value="today">Due today</option><option value="week">Next 7 days</option><option value="none">No follow-up set</option>
        </select>
        <div class="flex gap-2"><input type="date" class="in" title="Follow-up from" onchange="S.f.from=this.value;render()"><input type="date" class="in" title="Follow-up to" onchange="S.f.to=this.value;render()"></div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <div class="flex rounded-lg border border-white/10 overflow-hidden text-sm">
          <button id="vt" onclick="setView('table')" class="px-3 py-2"><i class="fa-solid fa-table-list mr-2"></i>Table</button>
          <button id="vk" onclick="setView('board')" class="px-3 py-2"><i class="fa-solid fa-table-columns mr-2"></i>Board</button>
        </div>
        <span id="cnt" class="text-sm text-slate-400"></span>
        <div class="flex-1"></div>
        <button id="bd" onclick="askDelete()" class="hidden px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-500 text-sm font-semibold"><i class="fa-solid fa-trash mr-2"></i><span></span></button>
        <button id="addb" onclick="openBulk()" class="ghost"><i class="fa-solid fa-file-import mr-2"></i>Bulk add</button>
        <button id="add" onclick="openForm()" class="btn"><i class="fa-solid fa-plus mr-2"></i>Add lead</button>
      </div>
    </section>

    <section id="list"></section>
  </main>
</div>

<!-- DRAWER -->
<div id="dov" class="fixed inset-0 bg-black/60 z-40 hidden" onclick="closeDrawer()"></div>
<aside id="drawer" class="drawer fixed top-0 right-0 h-full w-full max-w-lg z-50 bg-[#10161d] border-l border-white/10 overflow-y-auto"></aside>

<!-- MODAL -->
<div id="modal" class="fixed inset-0 z-[60] hidden bg-black/70 flex items-start sm:items-center justify-center p-4 overflow-y-auto"><div id="mb" class="glass bg-[#10161d] w-full max-w-xl p-6"></div></div>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[70] hidden bg-[#1c2530] border border-white/10 rounded-xl px-4 py-3 text-sm shadow-2xl"></div>

<script>
/* ================= FIREBASE CONFIG TEMPLATE =================
   Paste your Firebase web-app config below. Until then the app runs in
   Local mode (data saved in this browser only).
   Realtime Database data lives at /leads                          */
const FB_CFG={
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_PROJECT.firebaseapp.com",
  databaseURL:"https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId:"YOUR_PROJECT",
  storageBucket:"YOUR_PROJECT.appspot.com",
  messagingSenderId:"000000000000",
  appId:"YOUR_APP_ID"
};

/* ================= DATA LAYER ================= */
const USEFB=typeof firebase!=='undefined' &&
  !!FB_CFG.apiKey && !FB_CFG.apiKey.startsWith('YOUR_') &&
  !!FB_CFG.databaseURL && !FB_CFG.databaseURL.includes('YOUR_PROJECT') &&
  !!FB_CFG.projectId && !FB_CFG.projectId.startsWith('YOUR_');
const DB=USEFB?(()=>{
  firebase.initializeApp(FB_CFG);const r=firebase.database().ref('leads');
  return{
    sub:cb=>r.on('value',s=>cb(Object.values(s.val()||{}))),
    save:l=>r.child(l.id).set(l),
    del:ids=>{const u={};ids.forEach(i=>u[i]=null);return r.update(u)},
    saveMany:ls=>{const u={};ls.forEach(l=>u[l.id]=l);return r.update(u)}
  };
})():(()=>{
  const K='aspyra_leads_v1';let cb=()=>{};
  const load=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return[]}};
  const put=a=>{try{localStorage.setItem(K,JSON.stringify(a))}catch(e){}cb(a)};
  window.addEventListener('storage',e=>{if(e.key===K)cb(load())});
  return{sub:f=>{cb=f;f(load())},save:l=>{const a=load().filter(x=>x.id!==l.id);a.push(l);put(a)},del:ids=>put(load().filter(x=>!ids.includes(x.id))),saveMany:ls=>{const ids=ls.map(l=>l.id);put(load().filter(x=>!ids.includes(x.id)).concat(ls))}};
})();

/* ================= CONSTANTS & STATE ================= */
const USERS={MasterAdmin:{p:'ArjunDcosta',role:'master',name:'Master Admin'},Admin:{p:'AspyraRealty',role:'admin',name:'Admin'},Agent1:{p:'Agent123',role:'agent',name:'Agent 1'}};
const STATUSES=['New','Contacted','Site Visit Scheduled','Negotiation','Closed','Lost'];
const SC={'New':'#60a5fa','Contacted':'#a78bfa','Site Visit Scheduled':'#fbbf24','Negotiation':'#fb923c','Closed':'#2dd4bf','Lost':'#f87171'};
const AGENTS=['Agent 1','Agent 2','Agent 3'],TYPES=['Flat','Villa','Plot','Commercial'];
const POSS=['Ready to move','Within 3 months','Within 6 months','Within 1 year','1 year or more'];
const S={user:null,leads:[],view:'table',sel:new Set(),open:null,f:{q:'',status:'',agent:'',fu:'',from:'',to:''}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isMaster=()=>S.user.role==='master',isAgent=()=>S.user.role==='agent';
const fmtL=n=>{n=+n||0;return n>=100?'₹'+(+(n/100).toFixed(2))+'Cr':'₹'+(+n.toFixed(1))+'L'};
const budget=l=>(+l.bMin||+l.bMax)?(+l.bMin===+l.bMax?fmtL(l.bMin):fmtL(l.bMin)+' - '+fmtL(l.bMax)):'Budget not set';
const fdt=s=>s?new Date(s).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'';
const dkey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const phoneDigits=p=>{let d=String(p).replace(/\D/g,'');return d.length===10?'91'+d:d};
const done=l=>l.status==='Closed'||l.status==='Lost';
const tl=l=>l.timeline||[];

function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2600)}
function log(l,text,kind){(l.timeline=tl(l)).push({t:new Date().toISOString(),by:S.user.name,text,kind:kind||'note'})}
function save(l){l.updated=new Date().toISOString();return DB.save(l)}

/* ================= AUTH ================= */
$('lf').addEventListener('submit',e=>{
  e.preventDefault();const u=USERS[$('u').value.trim()];
  if(!u||u.p!==$('p').value){$('le').classList.remove('hidden');return}
  S.user={...u,id:$('u').value.trim()};$('lf').reset();$('le').classList.add('hidden');
  $('login').classList.add('hidden');$('app').classList.remove('hidden');boot();
});
function logout(){S.user=null;S.sel.clear();closeDrawer();$('app').classList.add('hidden');$('login').classList.remove('hidden')}

let subscribed=false;
function boot(){
  $('who').textContent=S.user.name+' · '+({master:'Master Admin',admin:'Admin',agent:'Agent'})[S.user.role];$('mode').classList.toggle('hidden',USEFB);
  $('add').classList.toggle('hidden',isAgent());$('addb').classList.toggle('hidden',isAgent());
  $('fa').classList.toggle('hidden',isAgent());$('fs').innerHTML='<option value="">All statuses</option>'+STATUSES.map(s=>`<option>${s}</option>`).join('');
  $('fa').innerHTML='<option value="">All agents</option>'+AGENTS.concat('Unassigned').map(s=>`<option>${s}</option>`).join('');
  S.f={q:'',status:'',agent:'',fu:'',from:'',to:''};$('fq').value='';$('fs').value='';$('fa').value='';$('ff').value='';
  setView(S.view);
  if(!subscribed){subscribed=true;DB.sub(a=>{S.leads=a.map(x=>({...x,timeline:x.timeline||[]}));if(S.user){render();if(S.open)drawer()}})}
  else render();
}

/* ================= FILTERING ================= */
function scoped(){return isAgent()?S.leads.filter(l=>l.agent===S.user.name):S.leads}
function visible(){
  const f=S.f,q=f.q.trim().toLowerCase(),now=new Date(),td=dkey(now),wk=new Date(now.getTime()+7*864e5);
  return scoped().filter(l=>{
    if(q&&![l.name,l.phone,l.location,l.type].join(' ').toLowerCase().includes(q))return false;
    if(f.status&&l.status!==f.status)return false;
    if(f.agent&&l.agent!==f.agent)return false;
    if(f.from&&(!l.followUp||dkey(l.followUp)<f.from))return false;
    if(f.to&&(!l.followUp||dkey(l.followUp)>f.to))return false;
    if(f.fu){
      if(f.fu==='none')return !l.followUp;
      if(!l.followUp||done(l))return false;
      const d=new Date(l.followUp);
      if(f.fu==='overdue')return d<now;
      if(f.fu==='today')return dkey(d)===td;
      if(f.fu==='week')return d>=now&&d<=wk;
    }
    return true;
  }).sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
}

/* ================= RENDER ================= */
function render(){kpis();list();bell();bulkBar()}
function setView(v){S.view=v;[['vt','table'],['vk','board']].forEach(([id,k])=>{$(id).className='px-3 py-2 '+(v===k?'bg-[#c9a24b] text-[#1a1405] font-bold':'text-slate-300 hover:bg-white/5')});if(S.user)list()}

function kpis(){
  const L=scoped(),now=new Date(),td=dkey(now);
  const due=L.filter(l=>l.followUp&&!done(l)&&dkey(l.followUp)===td).length;
  const over=L.filter(l=>l.followUp&&!done(l)&&new Date(l.followUp)<now&&dkey(l.followUp)!==td).length;
  const sv=L.filter(l=>l.status==='Site Visit Scheduled').length;
  const mid=l=>((+l.bMin||0)+(+l.bMax||0))/2;
  const won=L.filter(l=>l.status==='Closed'),neg=L.filter(l=>l.status==='Negotiation');
  const card=(ic,c,lab,val,sub)=>`<div class="glass p-4"><div class="flex items-center justify-between"><span class="text-sm text-slate-400">${lab}</span><span class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:${c}22;color:${c}"><i class="fa-solid ${ic}"></i></span></div><div class="serif text-3xl mt-2">${val}</div><div class="text-xs text-slate-400 mt-1">${sub}</div></div>`;
  const tot=L.length||1;
  const bar=STATUSES.map(s=>{const n=L.filter(l=>l.status===s).length;return n?`<div title="${s}: ${n}" style="width:${n/tot*100}%;background:${SC[s]}"></div>`:''}).join('');
  $('kpis').innerHTML=
    card('fa-users','#60a5fa','Total leads',L.length,`<div class="flex h-1.5 rounded-full overflow-hidden bg-white/10 mt-1">${bar}</div>`)+
    card('fa-bell','#fb923c','Follow-ups due today',due,over?`<span class="text-rose-400">${over} overdue</span>`:'Nothing overdue')+
    card('fa-location-dot','#fbbf24','Site visits scheduled',sv,'Leads awaiting a visit')+
    card('fa-handshake','#2dd4bf','Deals closed',`${won.length} <span class="text-lg text-slate-400">· ${fmtL(won.reduce((a,l)=>a+mid(l),0))}</span>`,`Pipeline in negotiation: ${fmtL(neg.reduce((a,l)=>a+mid(l),0))}`);
}

function fuBadge(l){
  if(!l.followUp)return '<span class="chip bg-white/5 text-slate-400">No follow-up</span>';
  if(done(l))return `<span class="chip bg-white/5 text-slate-400">${fdt(l.followUp)}</span>`;
  const d=new Date(l.followUp),now=new Date();
  if(d<now)return `<span class="chip bg-rose-500/15 text-rose-300"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Overdue ${fdt(l.followUp)}</span>`;
  if(dkey(d)===dkey(now))return `<span class="chip bg-amber-400/15 text-amber-300"><i class="fa-regular fa-clock mr-1"></i>Today ${d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})}</span>`;
  return `<span class="chip bg-sky-400/15 text-sky-300"><i class="fa-regular fa-calendar mr-1"></i>${fdt(l.followUp)}</span>`;
}
const stChip=s=>`<span class="chip" style="background:${SC[s]}22;color:${SC[s]}">${s}</span>`;
const contact=l=>`<span class="inline-flex items-center gap-2"><span>${esc(l.phone)}</span><a href="https://wa.me/${phoneDigits(l.phone)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="text-emerald-400 hover:text-emerald-300" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a><a href="tel:+${phoneDigits(l.phone)}" onclick="event.stopPropagation()" class="text-sky-400 hover:text-sky-300" title="Call"><i class="fa-solid fa-phone"></i></a></span>`;
const agentSel=l=>`<select class="in !py-1 !text-xs !w-auto" ${isAgent()?'disabled':''} onclick="event.stopPropagation()" onchange="transfer('${l.id}',this.value)">${['Unassigned'].concat(AGENTS).map(a=>`<option ${a===l.agent?'selected':''}>${a}</option>`).join('')}</select>`;

function list(){
  const L=visible();$('cnt').textContent=L.length+' of '+scoped().length+' leads';
  if(!L.length){$('list').innerHTML=`<div class="glass p-12 text-center text-slate-400"><i class="fa-regular fa-folder-open text-4xl mb-3"></i><p class="text-lg text-slate-200">${scoped().length?'No leads match these filters':'No leads yet'}</p><p class="text-sm mt-1">${scoped().length?'Clear a filter or change your search.':isAgent()?'Leads assigned to you will appear here.':'Add your first lead to start tracking.'}</p></div>`;return}
  if(S.view==='board'){
    $('list').innerHTML=`<div class="flex gap-3 overflow-x-auto pb-3">`+STATUSES.map(s=>{
      const c=L.filter(l=>l.status===s);
      return `<div class="col glass min-w-[285px] w-[285px] shrink-0 p-3" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="this.classList.remove('over');dropTo('${s}',event)">
      <div class="flex items-center justify-between mb-3"><span class="font-semibold text-sm" style="color:${SC[s]}">${s}</span><span class="chip bg-white/10">${c.length}</span></div>
      <div class="space-y-3">${c.map(card).join('')||'<p class="text-xs text-slate-500 text-center py-4">Drop a lead here</p>'}</div></div>`}).join('')+`</div>`;
    return;
  }
  const all=L.length&&L.every(l=>S.sel.has(l.id));
  $('list').innerHTML=`<div class="glass overflow-x-auto"><table class="w-full text-sm min-w-[1000px]"><thead class="text-left text-xs text-slate-400 border-b border-white/10"><tr>
    ${isMaster()?`<th class="p-3 w-10"><input type="checkbox" ${all?'checked':''} onchange="selAll(this.checked)" aria-label="Select all"></th>`:''}
    <th class="p-3">Client</th><th class="p-3">Phone</th><th class="p-3">Budget</th><th class="p-3">Location</th><th class="p-3">Type</th><th class="p-3">Agent</th><th class="p-3">Status</th><th class="p-3">Next follow-up</th><th class="p-3"></th></tr></thead><tbody>`+
    L.map(l=>`<tr class="border-b border-white/5 hover:bg-white/[.03] cursor-pointer" onclick="openLead('${l.id}')">
      ${isMaster()?`<td class="p-3" onclick="event.stopPropagation()"><input type="checkbox" ${S.sel.has(l.id)?'checked':''} onchange="sel('${l.id}',this.checked)"></td>`:''}
      <td class="p-3 font-semibold">${esc(l.name)}</td><td class="p-3">${contact(l)}</td><td class="p-3 whitespace-nowrap">${budget(l)}</td>
      <td class="p-3">${esc(l.location)||'—'}</td><td class="p-3">${esc(l.type)||'—'}</td><td class="p-3">${agentSel(l)}</td><td class="p-3">${stChip(l.status)}</td><td class="p-3">${fuBadge(l)}</td>
      <td class="p-3 text-right whitespace-nowrap"><button class="ghost !px-2 !py-1" onclick="event.stopPropagation();openForm('${l.id}')" title="Edit"><i class="fa-solid fa-pen"></i></button></td></tr>`).join('')+`</tbody></table></div>`;
}
function card(l){
  return `<div draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${l.id}')" onclick="openLead('${l.id}')" class="rounded-xl bg-[#141a21] border border-white/10 p-3 cursor-pointer hover:border-[#c9a24b]/60 space-y-2">
    <div class="flex items-start justify-between gap-2"><div class="font-semibold">${esc(l.name)}</div>${isMaster()?`<input type="checkbox" ${S.sel.has(l.id)?'checked':''} onclick="event.stopPropagation()" onchange="sel('${l.id}',this.checked)" aria-label="Select lead">`:''}</div>
    <div class="text-sm">${contact(l)}</div>
    <div class="text-sm text-[#c9a24b] font-semibold">${budget(l)}</div>

const BH={name:['name','clientname','client','customername','customer','leadname','fullname','contactname'],
 phone:['phone','phonenumber','mobile','mobilenumber','mobileno','phoneno','contact','contactnumber','contactno','whatsapp','cell','tel','telephone'],
 type:['propertytype','type','property','category'],budget:['budget','budgetrange','pricerange','price'],
 location:['location','area','city','locality','place','address'],status:['status','leadstatus','stage'],
 agent:['agent','assignedagent','assignedto','agentname','owner','assignee'],notes:['notes','note','remarks','remark','comments','comment']};
const BORDER=['name','phone','type','budget','location','status','agent','notes'];
const BLAB={name:'Name',phone:'Phone',type:'Property type',budget:'Budget',location:'Location',status:'Status',agent:'Agent',notes:'Notes'};
const hKey=c=>{const n=String(c).toLowerCase().replace(/[^a-z0-9]/g,'');return BORDER.find(k=>BH[k].includes(n))||''};
const pDigits=s=>{let d=String(s).replace(/\D/g,'');if(d.length===11&&d[0]==='0')d=d.slice(1);return d};
const isPh=s=>pDigits(s).length>=10&&/^[\d\s+\-().]+$/.test(String(s));
function splitRow(line,d){const o=[];let c='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){c+='"';i++}else q=!q}else if(ch===d&&!q){o.push(c.trim());c=''}else c+=ch}o.push(c.trim());return o}
function parseAmt(s){const m=String(s).replace(/[₹,\s]/g,'').match(/^([\d.]+)(cr|crore|crores|l|lac|lacs|lakh|lakhs)?$/i);return m?{n:parseFloat(m[1]),u:m[2]?(/^c/i.test(m[2])?'c':'l'):''}:null}
function parseBudget(s){
  const p=String(s).split(/\s*(?:-|–|—|\bto\b)\s*/i).filter(Boolean).map(parseAmt);
  if(!p.length||p.length>2||p.some(x=>!x||isNaN(x.n)))return null;
  const u=p.map(x=>x.u).find(x=>x)||'l',v=p.map(x=>x.n*((x.u||u)==='c'?100:1)),a=v[0],b=v.length>1?v[1]:v[0];
  return{bMin:Math.min(a,b),bMax:Math.max(a,b)};
}
const typeOf=t=>{t=String(t).toLowerCase().trim();return /^(flat|apartment|apt)/.test(t)?'Flat':/^villa/.test(t)?'Villa':/^(plot|land)/.test(t)?'Plot':/^(commercial|shop|office)/.test(t)?'Commercial':null};
const statusOf=t=>{t=String(t).toLowerCase().trim();const e=STATUSES.find(x=>x.toLowerCase()===t);if(e)return e;return /^(site|visit)/.test(t)?'Site Visit Scheduled':/^negot/.test(t)?'Negotiation':/^contact/.test(t)?'Contacted':/^(clos|won|sold)/.test(t)?'Closed':/^(lost|dead|drop|not interested)/.test(t)?'Lost':/^(new|fresh|open)/.test(t)?'New':null};
const agentOf=t=>{const n=String(t).toLowerCase().replace(/[^a-z0-9]/g,'');if(!n||/^(unassigned|none|na|nil)$/.test(n))return 'Unassigned';const m=n.match(/^(?:agent)?([123])$/);return m?'Agent '+m[1]:null};

function detectDelimiter(text){
  const first=(String(text).split(/\r?\n/).find(line=>line.trim())||'');
  let quoted=false,counts={'\t':0,',':0,';':0,'|':0};
  for(let i=0;i<first.length;i++){
    const ch=first[i];
    if(ch==='"'){if(quoted&&first[i+1]==='"'){i++;continue}quoted=!quoted;continue}
    if(!quoted&&Object.prototype.hasOwnProperty.call(counts,ch))counts[ch]++;
  }
  const best=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  return counts[best]>0?best:null;
}
function parseDelimited(text,delimiter){
  const rows=[];let row=[],cell='',quoted=false,started=false;
  const src=String(text||'').replace(/^\uFEFF/,'');
  for(let i=0;i<src.length;i++){
    const ch=src[i];
    if(ch==='"'){
      if(quoted&&src[i+1]==='"'){cell+='"';i++}
      else if(!quoted&&!cell.length)quoted=true;
      else if(quoted)quoted=false;
      else cell+=ch;
      started=true;
    }else if(ch===delimiter&&!quoted){
      row.push(cell.trim());cell='';started=false;
    }else if((ch==='\n'||ch==='\r')&&!quoted){
      if(ch==='\r'&&src[i+1]==='\n')i++;
      row.push(cell.trim());
      if(row.some(v=>v!==''))rows.push(row);
      row=[];cell='';started=false;
    }else{cell+=ch;started=true}
  }
  if(cell.length||row.length||started){
    row.push(cell.trim());
    if(row.some(v=>v!==''))rows.push(row);
  }
  return rows;
}
function bulkRows(text){
  const src=String(text||'').trim();
  if(!src)return [];
  const d=detectDelimiter(src);
  if(!d)return src.split(/\r?\n/).map(line=>line.trim()? [line.trim()]:null);
  return parseDelimited(src,d);
}
function bulkParse(){
  const rows=bulkRows($('bk-txt').value),ok=[],bad=[],skipDup=$('bk-dup').checked,dAg=$('bk-ag').value,dSt=$('bk-st').value;
  const seen=new Set(S.leads.map(l=>pDigits(l.phone).slice(-10)));
  const fi=rows.findIndex(r=>r&&r.some(c=>c)),hdr=fi>=0?rows[fi].map(hKey):null;
  const isHdr=!!hdr&&(hdr.includes('name')||hdr.includes('phone')||hdr.filter(Boolean).length>=2),idx={};
  if(isHdr)hdr.forEach((k,j)=>{if(k&&idx[k]===undefined)idx[k]=j});else BORDER.forEach((k,j)=>idx[k]=j);
  const note=isHdr?'Columns detected: '+Object.keys(idx).map(k=>BLAB[k]).join(', ')+'. Other columns are ignored.'+(idx.name===undefined||idx.phone===undefined?' A Name and a Phone column are required.':''):'No header row found. Reading columns in this order: Name, Phone, Property type, Budget, Location, Status, Agent, Notes.';
  for(let i=isHdr?fi+1:Math.max(fi,0);i<rows.length;i++){
    const c=rows[i];if(!c||c.every(x=>!String(x).trim()))continue;
    const n=i+1,g=k=>idx[k]===undefined||c[idx[k]]==null?'':String(c[idx[k]]).trim();
    let name=g('name'),ph=g('phone');
    if(!isHdr){
      if(c.length===1){const m=c[0].match(/\+?\d[\d\s\-()]{8,}\d/);if(m){ph=m[0];name=c[0].replace(m[0],' ').replace(/[,:;|()\-]+/g,' ').replace(/\s+/g,' ').trim()}}
      else if(isPh(c[0])&&!isPh(c[1]||'')){name=g('phone');ph=g('name')}
    }
    const dg=pDigits(ph),why=[];
    if(!name)why.push('Name is missing');
    if(!ph)why.push('Phone number is missing');else if(dg.length<10||dg.length>15)why.push('Phone number looks invalid');
    if(why.length){bad.push({n,name,phone:ph,why:why.join(' and ')});continue}
    const key=dg.slice(-10);
    if(skipDup&&seen.has(key)){bad.push({n,name,phone:ph,why:'Phone number already exists in your leads or earlier in this file',dup:true});continue}
    seen.add(key);
    const w=[];let type='N/A',bMin=0,bMax=0,status=dSt,agent=dAg;
    const tR=g('type');if(tR){const t=typeOf(tR);if(t)type=t;else w.push('Property type “'+tR+'” not recognised, set to N/A')}
    const bR=g('budget');if(bR){const b=parseBudget(bR);if(b){bMin=b.bMin;bMax=b.bMax}else w.push('Budget “'+bR+'” could not be read, left blank')}
    const sR=g('status');if(sR){const x=statusOf(sR);if(x)status=x;else w.push('Status “'+sR+'” not recognised, using '+dSt)}
    const aR=g('agent');if(aR){const x=agentOf(aR);if(x)agent=x;else w.push('Agent “'+aR+'” not recognised, using '+dAg)}
    ok.push({n,name,phone:(ph.trim().startsWith('+')?'+':'')+dg,type,bMin,bMax,location:g('location'),status,agent,notes:g('notes'),w});
  }
  const over=ok.length>2000;if(over)ok.length=2000;
  return{ok,bad,note,over};
}

function bulkCount(){const r=S.bk,n=r?r.ok.filter(x=>!S.bx.has(x.n)).length:0,b=$('bk-go');b.disabled=!n;b.style.opacity=n?1:.5;b.textContent=n?`Confirm Bulk Upload (${n})`:'Confirm Bulk Upload'}

  <label class="dz block text-center p-5" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');bulkFile(event.dataTransfer.files[0])">

  <textarea id="bk-txt" rows="5" class="in font-mono !text-xs" oninput="bulkPreview(true)" placeholder="Name, Phone, Property Type, Budget, Location, Status, Agent, Notes&#10;Rahul Mehta, 9876543210, Flat, 75L-1.5Cr, Whitefield, New, Agent 2, Wants a video tour&#10;Sneha Rao, 9123456780"></textarea></div>

function bulkFile(f){
  if(!f)return;
  if(!$('bk-txt'))return toast('Open Bulk add before choosing a file.');
  const ext=(f.name.split('.').pop()||'').toLowerCase(),r=new FileReader();
  if(!['csv','tsv','txt','xlsx','xls'].includes(ext))return toast('Choose a CSV, TSV, XLSX or XLS file.');
  if(f.size>15*1024*1024)return toast('File is larger than 15 MB. Split it into smaller files and try again.');
  const put=t=>{$('bk-txt').value=t;bulkPreview(true);toast('Loaded '+f.name)};
  r.onerror=()=>toast('Couldn’t read that file. Save it as CSV and try again.');
  if(ext==='xlsx'||ext==='xls'){
    if(typeof XLSX==='undefined')return toast('Excel support didn’t load. Check your connection or paste the rows instead.');
    r.onload=()=>{try{const wb=XLSX.read(r.result,{type:'array'}),a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});put(a.map(row=>row.map(c=>String(c).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n'))}catch(e){toast('That Excel file couldn’t be read. Save it as CSV and try again.')}};
    r.readAsArrayBuffer(f);

  else toast('Choose a CSV, XLSX or XLS file.');
}
function doBulk(){
  if(isAgent()||!S.bk)return;
  const rows=S.bk.ok.filter(x=>!S.bx.has(x.n));if(!rows.length)return;
  const b=$('bk-go');b.disabled=true;b.textContent='Uploading…';
  const t0=Date.now(),iso=new Date().toISOString(),role=roleLabel();
  const ls=rows.map((r,i)=>{
    const l={id:'L'+(t0+i).toString(36)+Math.random().toString(36).slice(2,5),created:iso,updated:iso,timeline:[],siteVisit:'',followUp:'',poss:'',name:r.name,phone:r.phone,type:r.type,bMin:r.bMin,bMax:r.bMax,location:r.location,status:r.status,agent:r.agent,notes:r.notes};
    log(l,`Lead imported via Bulk Upload by ${role}`,'system');
    if(l.agent!=='Unassigned')log(l,`Assigned to ${l.agent}`,'transfer');
    if(r.notes)log(l,'Import note: '+r.notes,'note');
    return l;
  });
  Promise.resolve().then(()=>DB.saveMany(ls)).then(()=>{
    hideModal();toast(ls.length+' lead'+(ls.length>1?'s':'')+' imported');
  }).catch(err=>{
    toast('Bulk upload failed. No success was reported; check your database rules and try again.');

}

function dueList(){

}
function bell(){
