<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aspyra Realty - Lead Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div id="app" class="min-h-screen flex flex-col justify-between">
        <!-- Login & Dashboard Container -->
        <div class="flex items-center justify-center min-h-screen bg-gray-900 px-4">
            <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
                <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Aspyra Realty Login</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Select Role</label>
                        <select id="roleSelect" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="MasterAdmin">Master Admin</option>
                            <option value="Admin">Admin</option>
                            <option value="Agent">Agent</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Username</label>
                        <input type="text" id="usernameInput" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Enter username">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="passwordInput" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Enter password">
                    </div>
                    <button type="button" id="loginBtn" onclick="handleLogin()" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 font-semibold">Login</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            const role = document.getElementById('roleSelect').value;
            const username = document.getElementById('usernameInput').value;
            const password = document.getElementById('passwordInput').value;

            if(!username || !password) {
                alert('Please enter username and password');
                return;
            }

            // Simple validation simulation & dashboard load trigger
            if((role === 'MasterAdmin' && username === 'MasterAdmin' && password === 'ArjunDcosta') ||
               (role === 'Admin' && username === 'Admin' && password === 'AspyraRealty') ||
               (role === 'Agent' && username === 'Agent1' && password === 'Agent123')) {
                alert('Login Successful! Loading dashboard...');
                // Yahan aapka dashboard render logic trigger hoga
            } else {
                alert('Invalid Credentials!');
            }
        }
    </script>
</body>
</html>
